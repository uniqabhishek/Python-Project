<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice Assistant · 3D</title>

<style>
  :root {
    --bg-0: #05060a;
    --bg-1: #0b0f1a;
    --panel: rgba(20, 24, 38, 0.55);
    --panel-brd: rgba(120, 160, 255, 0.18);
    --accent: #6aa6ff;
    --accent-2: #b38bff;
    --accent-3: #4ee0c8;
    --text: #e9eefb;
    --muted: #8d97b5;
    --user: #7fe3ff;
    --bot: #b9c4ff;
    --glow: 0 0 40px rgba(106,166,255,0.35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 700px at 20% -10%, #16224a 0%, transparent 60%),
      radial-gradient(900px 600px at 100% 110%, #2a1650 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-1), var(--bg-0));
    min-height: 100vh;
    overflow-x: hidden;
    perspective: 1400px;
  }

  /* moving grid backdrop */
  .grid-bg {
    position: fixed; inset: -10% -10% -10% -10%;
    background-image:
      linear-gradient(rgba(120,160,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,160,255,0.06) 1px, transparent 1px);
    background-size: 60px 60px, 60px 60px;
    transform: perspective(600px) rotateX(60deg) translateZ(-200px);
    animation: gridMove 20s linear infinite;
    pointer-events: none;
    z-index: 0;
    mask-image: radial-gradient(circle at 50% 40%, black 0%, transparent 75%);
  }
  @keyframes gridMove {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 0 60px, 60px 0; }
  }

  .orb-canvas {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.85;
    mix-blend-mode: screen;
  }

  .wrap {
    position: relative;
    z-index: 2;
    max-width: 860px;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 3rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    min-height: 100vh;
  }

  header {
    text-align: center;
    transform-style: preserve-3d;
    animation: floatIn 1s cubic-bezier(.2,.8,.2,1) both;
  }
  h1 {
    margin: 0;
    font-size: clamp(1.6rem, 3.2vw, 2.3rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent-3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 24px rgba(106,166,255,0.25));
  }
  .sub {
    margin-top: 0.4rem;
    color: var(--muted);
    font-size: 0.92rem;
  }

  @keyframes floatIn {
    from { opacity: 0; transform: translateY(18px) rotateX(-12deg); }
    to   { opacity: 1; transform: translateY(0) rotateX(0); }
  }

  /* ---- glass chat panel with 3D tilt ---- */
  .card {
    position: relative;
    border-radius: 22px;
    background: var(--panel);
    border: 1px solid var(--panel-brd);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow:
      0 30px 60px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.06),
      var(--glow);
    transform-style: preserve-3d;
    transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .3s;
    will-change: transform;
    overflow: hidden;
    animation: cardIn 1.1s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) rotateX(10deg) scale(.98); }
    to   { opacity: 1; transform: translateY(0)   rotateX(0)    scale(1); }
  }

  .card::before {
    /* subtle moving sheen */
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.06) 50%, transparent 70%);
    transform: translateX(-100%);
    animation: sheen 6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes sheen {
    0%, 70%, 100% { transform: translateX(-100%); }
    85%           { transform: translateX(100%); }
  }

  .chat {
    height: min(52vh, 480px);
    overflow-y: auto;
    padding: 1.1rem 1.1rem 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
    scroll-behavior: smooth;
  }
  .chat::-webkit-scrollbar { width: 8px; }
  .chat::-webkit-scrollbar-thumb {
    background: linear-gradient(var(--accent), var(--accent-2));
    border-radius: 999px;
  }
  .chat::-webkit-scrollbar-track { background: transparent; }

  .msg {
    max-width: 78%;
    padding: 0.65rem 0.95rem;
    border-radius: 14px;
    line-height: 1.45;
    font-size: 0.96rem;
    word-wrap: break-word;
    transform-origin: center bottom;
    animation: popIn .35s cubic-bezier(.2,.9,.3,1.4) both;
    will-change: transform;
  }
  @keyframes popIn {
    from { opacity: 0; transform: translateY(10px) scale(.96) rotateX(-8deg); }
    to   { opacity: 1; transform: translateY(0)    scale(1)   rotateX(0); }
  }

  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #123a5e, #0f2c4d);
    color: var(--user);
    border: 1px solid rgba(127,227,255,0.25);
    box-shadow: 0 8px 24px rgba(127,227,255,0.08);
  }
  .msg.bot {
    align-self: flex-start;
    background: linear-gradient(135deg, #1a2140, #171a30);
    color: var(--bot);
    border: 1px solid rgba(185,196,255,0.18);
    box-shadow: 0 8px 24px rgba(106,166,255,0.10);
  }
  .msg.sys {
    align-self: center;
    background: transparent;
    color: var(--muted);
    font-size: 0.82rem;
  }
  .msg a { color: var(--accent-3); }

  /* ---- controls with 3D lift ---- */
  .controls {
    display: flex;
    gap: 0.55rem;
    transform-style: preserve-3d;
  }
  input[type="text"] {
    flex: 1;
    padding: 0.95rem 1.1rem;
    border-radius: 14px;
    border: 1px solid var(--panel-brd);
    background: rgba(10, 14, 26, 0.7);
    color: var(--text);
    font-size: 1rem;
    outline: none;
    transition: transform .2s, border-color .2s, box-shadow .2s;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
  }
  input[type="text"]::placeholder { color: #586a92; }
  input[type="text"]:focus {
    border-color: rgba(106,166,255,0.6);
    box-shadow: 0 0 0 4px rgba(106,166,255,0.12), inset 0 1px 0 rgba(255,255,255,0.06);
    transform: translateY(-1px);
  }

  button {
    position: relative;
    padding: 0 1.15rem;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.08);
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #0a1020;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform .15s cubic-bezier(.2,.9,.3,1.4), box-shadow .25s, filter .2s;
    box-shadow: 0 10px 24px rgba(106,166,255,0.30), inset 0 1px 0 rgba(255,255,255,0.4);
    transform-style: preserve-3d;
    will-change: transform;
    user-select: none;
  }
  button:hover  { transform: translateY(-3px) rotateX(6deg) scale(1.03); filter: brightness(1.08); }
  button:active { transform: translateY(0)    rotateX(0)   scale(.97); }
  button:disabled { filter: grayscale(.6) brightness(.8); cursor: not-allowed; }

  #micBtn {
    width: 56px;
    padding: 0;
    font-size: 1.25rem;
  }
  #micBtn.listening {
    background: linear-gradient(135deg, #ff4d7d, #ff8a5c);
    animation: micPulse 1.2s infinite;
  }
  @keyframes micPulse {
    0%   { box-shadow: 0 0 0 0 rgba(255,77,125,0.65), 0 10px 24px rgba(255,77,125,0.4); }
    70%  { box-shadow: 0 0 0 18px rgba(255,77,125,0), 0 10px 24px rgba(255,77,125,0.2); }
    100% { box-shadow: 0 0 0 0 rgba(255,77,125,0), 0 10px 24px rgba(255,77,125,0.2); }
  }

  .status {
    text-align: center;
    min-height: 1.3em;
    font-size: 0.86rem;
    color: var(--muted);
    transition: color .2s;
  }
  .warn { color: #ffb454; }

  /* particles layer */
  .particles {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
    .grid-bg { animation: none; }
  }
</style>
</head>
<body>

  <div class="grid-bg"></div>
  <canvas class="orb-canvas" id="orb"></canvas>
  <canvas class="particles" id="particles"></canvas>

  <div class="wrap">
    <header>
      <h1>🎙️ Voice Assistant</h1>
      <div class="sub">Speak or type · powered by real-time 3D</div>
    </header>

    <div class="card" id="card">
      <div class="chat" id="chat"></div>
    </div>

    <div class="controls">
      <input id="textInput" type="text" placeholder="Type a command…" autocomplete="off" />
      <button id="sendBtn">Send</button>
      <button id="micBtn" title="Hold to talk">🎤</button>
    </div>

    <div class="status" id="status"></div>
  </div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
  "use strict";

  const orbState = { listening: false, speaking: false, energy: 0 };

  // ============================================================
  //  3D orb + particles + tilt  (unchanged)
  // ============================================================
  function initOrb() {
    const canvas = document.getElementById("orb");
    if (!window.THREE) return;

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 6.5);

    const mat = new THREE.MeshBasicMaterial({ color: 0x6aa6ff, wireframe: true, transparent: true, opacity: 0.45 });
    const orb = new THREE.Mesh(new THREE.IcosahedronGeometry(2.1, 2), mat);
    scene.add(orb);

    const innerMat = new THREE.MeshBasicMaterial({ color: 0xb38bff, transparent: true, opacity: 0.10 });
    const inner = new THREE.Mesh(new THREE.IcosahedronGeometry(1.55, 1), innerMat);
    scene.add(inner);

    const haloMat = new THREE.MeshBasicMaterial({ color: 0x4ee0c8, wireframe: true, transparent: true, opacity: 0.18 });
    const halo = new THREE.Mesh(new THREE.IcosahedronGeometry(2.8, 1), haloMat);
    scene.add(halo);

    const count = 900;
    const positions = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const r = 2.6 + Math.random() * 2.4;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
      positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta) * 0.5;
      positions[i*3+2] = r * Math.cos(phi);
    }
    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    const ring = new THREE.Points(pGeo, new THREE.PointsMaterial({ color: 0x7fe3ff, size: 0.03, transparent: true, opacity: 0.7 }));
    scene.add(ring);

    const mouse = { x: 0, y: 0 };
    window.addEventListener("mousemove", (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = (e.clientY / window.innerHeight) * 2 - 1;
    });

    let t = 0;
    function animate() {
      requestAnimationFrame(animate);
      t += 0.006;

      const e = orbState.energy;
      const speed = 1 + e * 3;

      orb.rotation.y += 0.003 * speed;
      orb.rotation.x += 0.0015 * speed;
      inner.rotation.y -= 0.002 * speed;
      halo.rotation.y += 0.0012 * speed;
      halo.rotation.z += 0.0008 * speed;
      ring.rotation.y += 0.0015 * speed;
      ring.rotation.x = Math.sin(t * 0.4) * 0.15;

      const pulse = 1 + Math.sin(t * 6) * 0.015 + e * 0.10;
      orb.scale.setScalar(pulse);
      inner.scale.setScalar(1 + e * 0.08);
      halo.scale.setScalar(1 + e * 0.05);

      if (orbState.listening) {
        mat.color.lerp(new THREE.Color(0xff4d7d), 0.05);
        innerMat.color.lerp(new THREE.Color(0xff8a5c), 0.05);
      } else if (orbState.speaking) {
        mat.color.lerp(new THREE.Color(0x4ee0c8), 0.05);
        innerMat.color.lerp(new THREE.Color(0x6aa6ff), 0.05);
      } else {
        mat.color.lerp(new THREE.Color(0x6aa6ff), 0.05);
        innerMat.color.lerp(new THREE.Color(0xb38bff), 0.05);
      }

      camera.position.x += (mouse.x * 0.9 - camera.position.x) * 0.03;
      camera.position.y += (-mouse.y * 0.6 - camera.position.y) * 0.03;
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });
  }
  initOrb();

  function initParticles() {
    const c = document.getElementById("particles");
    const ctx = c.getContext("2d");
    let w, h, parts;

    function resize() {
      w = c.width  = window.innerWidth;
      h = c.height = window.innerHeight;
      parts = Array.from({ length: 70 }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.6 + 0.3,
        vx: (Math.random() - 0.5) * 0.15,
        vy: (Math.random() - 0.5) * 0.15,
        a: Math.random() * 0.4 + 0.1,
      }));
    }
    resize();
    window.addEventListener("resize", resize);

    function tick() {
      requestAnimationFrame(tick);
      ctx.clearRect(0, 0, w, h);
      for (const p of parts) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
        if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(140, 190, 255, ${p.a})`;
        ctx.fill();
      }
    }
    tick();
  }
  initParticles();

  function initTilt() {
    const card = document.getElementById("card");
    const max = 6;
    let raf = null;

    card.addEventListener("mousemove", (e) => {
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width  - 0.5;
      const py = (e.clientY - r.top)  / r.height - 0.5;
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        card.style.transform = `rotateY(${px * max}deg) rotateX(${-py * max}deg) translateZ(0)`;
      });
    });
    card.addEventListener("mouseleave", () => {
      card.style.transform = "";
      card.style.boxShadow = "";
    });
  }
  initTilt();

  // ============================================================
  //  Chat + backend
  // ============================================================
  const chatEl   = document.getElementById("chat");
  const inputEl  = document.getElementById("textInput");
  const sendBtn  = document.getElementById("sendBtn");
  const micBtn   = document.getElementById("micBtn");
  const statusEl = document.getElementById("status");

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const TTS_OK = "speechSynthesis" in window;

  let recognition = null;
  let listening = false;
  let voiceEnabled = true;

  // ---- NEW: hands-free state ----
  let handsFree = false;        // are we in always-listening mode?
  let restartTimer = null;      // pending auto-restart
  let busy = false;             // are we mid-request? don't listen then

  function addMsg(text, cls) {
    const div = document.createElement("div");
    div.className = `msg ${cls}`;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function setStatus(msg, warn = false) {
    statusEl.textContent = msg;
    statusEl.className = "status" + (warn ? " warn" : "");
  }

  function speak(text) {
  return new Promise((resolve) => {
    if (!TTS_OK || !voiceEnabled) {
      orbState.speaking = false;
      resolve();
      return;
    }
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);

      // ---- sweet, soft delivery ----
      u.rate  = 0.92;   // slightly slower than default → warmer
      u.pitch = 1.05;   // a touch higher → softer, sweeter
      u.volume = 0.95;  // slight reduction → less harsh

      const voices = window.speechSynthesis.getVoices();

      // Priority list — first match wins.
      // "Online (Natural)" voices only exist in Microsoft Edge.
      const PREFERRED = [
        "Microsoft Aria Online (Natural) - English (United States)",
        "Microsoft Aria Online (Natural)",
        "Microsoft Jenny Online (Natural)",
        "Microsoft Michelle Online (Natural)",
        "Microsoft Ana Online (Natural)",
        "Google UK English Female",
        "Google US English",
        "Samantha",       // macOS
        "Karen",          // macOS
        "Microsoft Zira", // Windows offline fallback
        "Hazel",          // Windows offline
      ];

      let chosen = null;

      // 1. Try the preferred list in order
      for (const name of PREFERRED) {
        chosen = voices.find(v => v.name === name);
        if (chosen) break;
      }

      // 2. Try anything with "female" or "natural" in the name
      if (!chosen) {
        chosen = voices.find(v =>
          v.lang.startsWith("en") &&
          /female|natural|aria|jenny|michelle|samantha|zira|karen/i.test(v.name)
        );
      }

      // 3. Any English voice
      if (!chosen) {
        chosen = voices.find(v => v.lang.startsWith("en"));
      }

      if (chosen) {
        u.voice = chosen;
        console.log(`[TTS] Using voice: ${chosen.name} (${chosen.lang})`);
      }

      u.onstart = () => { orbState.speaking = true;  orbState.energy = 0.9; };
      u.onend   = () => {
        orbState.speaking = false;
        orbState.energy = 0.0;
        resolve();
      };
      u.onerror = () => {
        orbState.speaking = false;
        orbState.energy = 0.0;
        voiceEnabled = false;
        resolve();
      };

      window.speechSynthesis.speak(u);
    } catch (e) {
      console.warn("TTS failed:", e);
      voiceEnabled = false;
      orbState.speaking = false;
      orbState.energy = 0.0;
      resolve();
    }
  });
}
  // ---- NEW: start/stop hands-free ----
  function startHandsFree() {
    if (!recognition) return;
    handsFree = true;
    micBtn.classList.add("listening");
    micBtn.textContent = "⏹";
    micBtn.title = "Click to stop listening";
    setStatus("🎤 Listening continuously — speak anytime. Click ⏹ to stop.");

    // small delay avoids "already started" errors
    clearTimeout(restartTimer);
    restartTimer = setTimeout(() => {
      try { recognition.start(); } catch (e) { /* already running */ }
    }, 100);
  }

  function stopHandsFree() {
    handsFree = false;
    clearTimeout(restartTimer);
    restartTimer = null;
    micBtn.classList.remove("listening");
    micBtn.textContent = "🎤";
    micBtn.title = "Click to start listening";
    orbState.listening = false;
    orbState.energy = 0.0;
    setStatus("Ready.");
    try { recognition.stop(); } catch (e) {}
  }

  // ---- NEW: auto-restart loop ----
  function armRecognition(delay = 300) {
    if (!handsFree) return;
    clearTimeout(restartTimer);
    restartTimer = setTimeout(() => {
      if (!handsFree || busy) return;
      try {
        recognition.start();
      } catch (e) {
        // "already started" is fine — just try again shortly
        if (String(e).includes("already started")) return;
        armRecognition(600);
      }
    }, delay);
  }

  async function sendCommand(cmd) {
    if (!cmd || !cmd.trim()) return;
    addMsg(cmd, "user");
    setStatus("Thinking…");
    busy = true;

    try {
      const res = await fetch("/api/command", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ command: cmd }),
      });
      if (!res.ok) throw new Error(`Server returned ${res.status}`);
      const data = await res.json();

      addMsg(data.text, "bot");
      // Wait for TTS to finish before re-arming the mic,
      // otherwise the assistant hears itself.
      await speak(data.text);

      if (data.open_url) {
        const w = window.open(data.open_url, "_blank", "noopener");
        if (!w) {
          const a = document.createElement("a");
          a.href = data.open_url;
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = `🔗 Open ${data.open_url}`;
          const p = addMsg("", "bot");
          p.appendChild(a);
        }
      }

      if (data.exit) {
        stopHandsFree();
        setStatus("Session ended. Refresh to start again.");
        return;
      }
      setStatus("🎤 Listening…");
    } catch (err) {
      console.error(err);
      addMsg("Sorry, something went wrong talking to the server.", "bot");
      setStatus("Network error.", true);
    } finally {
      busy = false;
      // Re-arm the mic for the next phrase
      if (handsFree) armRecognition(400);
    }
  }

  // ---- typed input (works in both modes) ----
  sendBtn.addEventListener("click", () => {
    const v = inputEl.value;
    inputEl.value = "";
    // In hands-free mode, stop listening while typing to avoid feedback
    if (handsFree) { recognition.stop(); }
    sendCommand(v);
  });

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      const v = inputEl.value;
      inputEl.value = "";
      if (handsFree) { recognition.stop(); }
      sendCommand(v);
    }
  });

  // ---- speech recognition setup ----
  if (!SR) {
    micBtn.disabled = true;
    micBtn.title = "Speech recognition not supported in this browser";
    setStatus("⚠️ Speech recognition unavailable — use Chrome, Edge, or Safari.", true);
  } else {
    recognition = new SR();
    recognition.lang = "en-US";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.continuous = false;  // we handle continuity ourselves

    recognition.onstart = () => {
      listening = true;
      orbState.listening = true;
      orbState.energy = 0.8;
      micBtn.classList.add("listening");
      if (handsFree) micBtn.textContent = "⏹";
      setStatus("🎤 Listening… speak now.");
    };

    recognition.onend = () => {
      listening = false;
      orbState.listening = false;
      orbState.energy = 0.0;

      // KEY CHANGE: auto-restart in hands-free mode
      if (handsFree && !busy) {
        armRecognition(250);
      } else if (!handsFree) {
        micBtn.classList.remove("listening");
        micBtn.textContent = "🎤";
        setStatus("Ready.");
      }
    };

    recognition.onerror = (e) => {
      listening = false;
      orbState.listening = false;
      orbState.energy = 0.0;

      const msgs = {
        "not-allowed":   "Microphone permission denied.",
        "no-speech":     "No speech detected.",
        "audio-capture": "No microphone found.",
        "network":       "Network error during recognition.",
        "aborted":       "Recognition aborted.",
      };

      // "no-speech" and "aborted" are normal in a loop — don't kill hands-free
      if (e.error === "no-speech" || e.error === "aborted") {
        if (handsFree && !busy) armRecognition(300);
        return;
      }

      setStatus(`⚠️ ${msgs[e.error] || e.error}`, true);

      if (e.error === "not-allowed" || e.error === "audio-capture" || e.error === "network") {
        stopHandsFree();
      } else if (handsFree) {
        armRecognition(600);
      }
    };

    recognition.onresult = (e) => {
      const transcript = e.results[0][0].transcript.trim();
      if (!transcript) {
        if (handsFree) armRecognition(200);
        return;
      }
      sendCommand(transcript);
    };

    // ---- click once = hands-free, click again = stop ----
    micBtn.addEventListener("click", () => {
      if (handsFree) {
        stopHandsFree();
      } else {
        startHandsFree();
      }
    });
  }

  if (TTS_OK) {
  // Voices load asynchronously in Chrome/Edge.
  // Prime the list now and refresh whenever the browser updates it.
  const refreshVoices = () => {
    const v = window.speechSynthesis.getVoices();
    if (v.length) {
      console.log(`[TTS] ${v.length} voices available`);
      const sweet = v.filter(x => /aria|jenny|michelle|female|samantha|zira/i.test(x.name));
      console.log("[TTS] sweet candidates:", sweet.map(x => x.name));
    }
  };
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}

  addMsg("Hi! Click 🎤 once and just start talking — I'll keep listening.", "bot");
  setStatus("Ready. Click 🎤 to begin.");
  // Paste this near the end of your IIFE, before the closing })();
window.reloadKB = async () => {
  const r = await fetch("/api/reload", { method: "POST" });
  const j = await r.json();
  console.log("Reloaded", j.intents, "intents");
  return j;
};
})();
</script>
